name: LINE Daily Push

on:
  schedule:
    - cron: '0 0 * * *'   # 每天台灣時間 08:00 (UTC+8)
  workflow_dispatch:        # 可手動觸發

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run LINE push script
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: node --experimental-vm-modules scripts/line-push.js
