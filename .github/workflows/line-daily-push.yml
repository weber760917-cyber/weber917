name: LINE Daily Push

on:
  schedule:
    - cron: '0 0 * * *'   # 每天台灣時間 08:00 (UTC 0:00 = TST 8:00)
  workflow_dispatch:        # 可手動觸發測試

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send LINE Flex Message
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: node scripts/line-push.js
