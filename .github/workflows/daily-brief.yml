name: 每日社群文案生成

on:
  schedule:
    # 週一~五 7:00 AM 台灣時間 (UTC 前一天 23:00)
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
    inputs:
      skip_story:
        description: '跳過故事生成（true/false）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      # ── 判斷今天是否要發故事（週一/三/五才發）──
      - name: Check story day
        id: story_check
        run: |
          SKIP_INPUT="${{ github.event.inputs.skip_story }}"
          TW_DOW=$(TZ=Asia/Taipei date +%u)   # 1=Mon ... 7=Sun
          echo "Taiwan DOW=$TW_DOW, skip_input=$SKIP_INPUT"
          # 週一(1)、週三(3)、週五(5) 才發故事
          if [ "$SKIP_INPUT" = "true" ]; then
            echo "run_story=false" >> $GITHUB_OUTPUT
          elif [ "$TW_DOW" = "1" ] || [ "$TW_DOW" = "3" ] || [ "$TW_DOW" = "5" ]; then
            echo "run_story=true" >> $GITHUB_OUTPUT
          else
            echo "run_story=false" >> $GITHUB_OUTPUT
          fi

      # ── 週一/三/五 生成案例故事 ──
      - name: 生成案例故事
        if: steps.story_check.outputs.run_story == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-story.js

      # ── 每天 生成市場早盤觀點 ──
      - name: 生成市場早盤觀點
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODE: morning
        run: node scripts/generate-brief.js

      # ── 每天 生成圖卡 ──
      - name: 生成圖卡
        run: node scripts/generate-images.js

      - name: Commit and push
        run: |
          git config user.name "Weber Bot"
          git config user.email "weber760917@gmail.com"
          git add data/brief.json data/stories.json data/images/
          git diff --staged --quiet || git commit -m "chore: 自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
