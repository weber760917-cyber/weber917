name: 每日社群文案生成

on:
  schedule:
    # 週一~五 7:00 AM 台灣時間 → 生成案例故事 (UTC 前一天 23:00)
    - cron: '0 23 * * 0-4'
    # 週一~五 8:00 AM 台灣時間 → 早盤觀點 (UTC 00:00)
    - cron: '0 0 * * 1-5'
    # 週一~五 16:00 台灣時間 → 收盤觀點 (UTC 08:00)
    - cron: '0 8 * * 1-5'
    # 週六日 6:00 AM 台灣時間 → 保險/信託文案 (UTC 前一天 22:00)
    - cron: '0 22 * * 5,6'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式（留空自動判斷）'
        required: false
        default: 'auto'
        type: choice
        options: [auto, story, morning, afternoon, weekend]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm 