name: 每日社群文案生成

on:
  schedule:
    - cron: '0 23 * * 0-4'   # 週一~五 7:00 AM 台灣時間
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: 生成案例故事
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-story.js

      - name: 生成市場早盤觀點
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODE: morning
        run: node scripts/generate-brief.js

      - name: Commit and push
        run: |
          git config user.name "Weber Bot"
          git config user.email "weber760917@gmail.com"
          git add data/brief.json data/stories.json
          git diff --staged --quiet || git commit -m "chore: 自動更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push

